<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>自動遷移中...</title>
</head>
<body>
    <p>自動で申し込みページへ移動しています。しばらくお待ちください。</p>

    <form id="autoForm" action="https://eplus.jp/sf/detail/1168340001?P6=775" method="POST">
        <input name="keyword" type="hidden" value="23144">
        <input type="submit" value="移動しない場合はこちらをクリックしてください">
    </form>

    <script>
        // ページ読み込み完了時にフォームを自動送信
        window.onload = function() {
            document.getElementById('autoForm').submit();
        };
    </script>
</body>
</html>
